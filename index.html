<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<title>Siddhartha — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#08090d;
  --surface:#0e1016;
  --surface2:#141720;
  --line:#252936;
  --text:#f5f7fb;
  --muted:#969dac;
  --accent:#ffffff;
  --soft:#c8ccd5;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(circle at 80% 0%,rgba(110,120,255,.10),transparent 30rem),
    radial-gradient(circle at 10% 30%,rgba(255,255,255,.035),transparent 28rem),
    var(--bg);
  color:var(--text);
  font-family:"DM Sans",system-ui,sans-serif;
  line-height:1.5;
  overflow-x:hidden;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.035;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
  z-index:99;
}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid #fff;outline-offset:5px}
.wrap{max-width:1320px;margin:auto;padding:0 clamp(20px,5vw,64px)}

.bar{
  height:82px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line);
}
.bar b{font:700 1rem "Space Grotesk";letter-spacing:.04em}
.bar nav{display:flex;gap:28px}
.bar nav a{text-decoration:none;color:var(--muted);font-size:.9rem;transition:.2s}
.bar nav a:hover{color:var(--text)}

.hero{padding:clamp(70px,13vh,150px) 0 90px;position:relative}
.eyebrow{
  color:var(--muted);font-size:.75rem;text-transform:uppercase;
  letter-spacing:.18em;margin-bottom:25px;
}
h1{
  font:700 clamp(4rem,12vw,10.5rem)/.82 "Space Grotesk";
  letter-spacing:-.075em;max-width:1100px;
}
.hero-bottom{
  display:flex;justify-content:space-between;gap:40px;align-items:flex-end;
  margin-top:55px;border-top:1px solid var(--line);padding-top:24px;
}
.hero-bottom p{max-width:470px;color:var(--muted);font-size:1.05rem}
.count{font:600 1rem "Space Grotesk";white-space:nowrap}

.section-head{
  display:flex;justify-content:space-between;align-items:end;
  margin-bottom:28px;padding-bottom:15px;border-bottom:1px solid var(--line)
}
.section-head h2{font:600 clamp(1.5rem,3vw,2.4rem) "Space Grotesk";letter-spacing:-.04em}
.section-head span{color:var(--muted);font-size:.85rem}

#stacks{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:55px 28px;padding-bottom:100px
}
.stack{display:block;width:100%;transition:transform .35s}
.stack:hover{transform:translateY(-7px)}
.pile{position:relative;aspect-ratio:1/1.18;display:block}
.p{
  position:absolute;inset:3% 5%;background:#191c24;padding:7px;
  border:1px solid #303440;box-shadow:0 25px 70px rgba(0,0,0,.45);
  transform:rotate(var(--r)) translate(var(--x),var(--y));
  transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s;
}
.p img{display:block;width:100%;height:100%;object-fit:cover;background:#11131a}
.stack:hover .p,.stack:focus-visible .p{
  transform:rotate(calc(var(--r)*2.1)) translate(calc(var(--x)*2.5),calc(var(--y)*1.9));
  box-shadow:0 30px 90px rgba(0,0,0,.65)
}
.lab{
  display:flex;justify-content:space-between;align-items:center;
  gap:15px;margin-top:16px;padding-top:15px;border-top:1px solid var(--line)
}
.lab h3{font:600 1.25rem "Space Grotesk";letter-spacing:-.025em}
.lab span{color:var(--muted);font-size:.8rem}
.msg{color:var(--muted);padding:30px 0;grid-column:1/-1}

.foot{
  display:grid;grid-template-columns:1fr 1fr;gap:60px;
  border-top:1px solid var(--line);padding:70px 0 40px
}
.foot h2{font:600 1.5rem "Space Grotesk";margin-bottom:12px}
.foot p{color:var(--muted);max-width:540px}
.links{display:flex;flex-wrap:wrap;gap:12px}
.links a{
  display:inline-flex;border:1px solid var(--line);border-radius:999px;
  padding:9px 15px;text-decoration:none;color:var(--soft);transition:.2s
}
.links a:hover{background:#fff;color:#08090d;border-color:#fff}
small.c{display:block;color:#666d7b;padding:0 0 30px;font-size:.78rem}

#deck{
  position:fixed;inset:0;z-index:40;background:#08090d;
  overflow-y:auto;display:none
}
#deck.open{display:block}
.dh{
  position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;
  align-items:center;padding:17px clamp(20px,5vw,64px);
  background:rgba(8,9,13,.88);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line)
}
.dh h2{font:600 clamp(1.4rem,4vw,2.6rem) "Space Grotesk";letter-spacing:-.04em}
.dh h2 span{font:400 .8rem "DM Sans";color:var(--muted);margin-left:10px;letter-spacing:0}
.back{
  border:1px solid var(--line);border-radius:999px;padding:9px 17px;
  font-size:.85rem;background:var(--surface)
}
.back:hover{background:#fff;color:#08090d}
#masonry{
  columns:3 280px;column-gap:18px;padding:25px clamp(20px,5vw,64px) 90px;
  max-width:1450px;margin:auto
}
.print{
  display:block;width:100%;break-inside:avoid;margin:0 0 18px;
  background:#151821;padding:6px;border:1px solid #292d38;
  animation:deal .5s cubic-bezier(.2,.8,.2,1) both;
  animation-delay:calc(min(var(--i),14)*45ms)
}
.print img{display:block;width:100%;height:auto;min-height:140px;background:#101218}
@keyframes deal{from{opacity:0;transform:translateY(-30px) rotate(calc(var(--t)*1deg)) scale(.96)}to{opacity:1;transform:none}}

#lb{
  position:fixed;inset:0;z-index:60;display:none;align-items:center;
  justify-content:center;flex-direction:column;background:rgba(2,3,6,.97);padding:20px
}
#lb.open{display:flex}
#lb img{
  max-width:min(94vw,1200px);max-height:82vh;border:1px solid #333844;
  background:#0c0e13;box-shadow:0 25px 100px rgba(0,0,0,.75);touch-action:pan-y
}
#cap{margin-top:15px;color:var(--muted);font-size:.85rem}
.rb{
  position:absolute;width:46px;height:46px;border-radius:50%;
  border:1px solid #343844;font-size:1.5rem;line-height:1;text-align:center;
  background:#11141b;z-index:2
}
.rb:hover{background:#fff;border-color:#fff;color:#08090d}
#lx{top:max(14px,env(safe-area-inset-top));right:14px}
#lp{left:18px;top:50%;transform:translateY(-50%)}
#ln{right:18px;top:50%;transform:translateY(-50%)}

@media(max-width:900px){
  #stacks{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:650px){
  .bar{height:70px}
  .bar nav{gap:16px}
  .hero{padding:70px 0 65px}
  h1{font-size:clamp(3.5rem,18vw,6rem)}
  .hero-bottom{display:block;margin-top:35px}
  .count{display:block;margin-top:20px}
  #stacks{grid-template-columns:1fr;gap:45px}
  .foot{grid-template-columns:1fr;gap:45px;padding-top:55px}
  #lp,#ln{top:auto;bottom:18px;transform:none}
  #lp{left:20px}#ln{right:20px}
  #lb img{max-height:76vh}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}.p,.stack{transition:none}.print{animation:none}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="bar">
    <b id="nm2"></b>
    <nav><a href="#stacks">Work</a><a href="#about">About</a></nav>
  </header>

  <section class="hero">
    <div class="eyebrow">Portfolio / Selected work</div>
    <h1 id="nm"></h1>
    <div class="hero-bottom">
      <p id="line"></p>
      <span class="count" id="tot"></span>
    </div>
  </section>

  <section>
    <div class="section-head">
      <h2>Collections</h2>
      <span>01 — Browse</span>
    </div>
    <main id="stacks" aria-label="Collections">
      <p class="msg">Loading photos…</p>
    </main>
  </section>

  <section class="foot" id="about">
    <div>
      <h2>About</h2>
      <p id="aboutText"></p>
    </div>
  </section>
  <small class="c">&copy; <span id="yr"></span> <span id="nm3"></span></small>
</div>

<div id="deck" role="dialog" aria-modal="true" aria-labelledby="dt">
  <div class="dh">
    <h2 id="dt"></h2>
    <button class="back" id="back">← Back</button>
  </div>
  <div id="masonry"></div>
</div>

<div id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="rb" id="lx" aria-label="Close photo">&times;</button>
  <button class="rb" id="lp" aria-label="Previous photo">&lsaquo;</button>
  <img id="li" alt="">
  <div id="cap"></div>
  <button class="rb" id="ln" aria-label="Next photo">&rsaquo;</button>
</div>

<script>
/* ---- edit these ---- */
const SITE={
  name:"Siddhartha",
  line:"Photography, projects and moments — collected into visual stories.",
  about:"I’m Siddhartha Mishra, a creative person passionate about photography, visual design, Canva, web development, and digital media. I enjoy turning ideas into clean and engaging visuals — from capturing moments through photography to creating designs, editing content, and building responsive websites. I like experimenting with new ideas and combining creativity with technology to create work that feels simple, modern, and meaningful. My skills include Photography, Photo & Video Editing, Canva Design, UI/UX, Web Development, and Creative Content. I’m always learning, exploring new tools, and working on projects that help me grow as a creative developer.",
};
const USER="siddhartha018", REPO="portfolio", BRANCH="main", FOLDER="images";
/* -------------------- */
const EXT=/\.(jpe?g|png|gif|webp|avif|svg|bmp)$/i;
const RAW=p=>`https://raw.githubusercontent.com/${USER}/${REPO}/${BRANCH}/`+p.split("/").map(encodeURIComponent).join("/");
const $=id=>document.getElementById(id);
const nat=(a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:"base"});
const nice=s=>s.replace(/[_-]+/g," ").trim();
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}

/* --- load file list from GitHub (same logic as before) --- */
async function fromTree(){
  const r=await fetch(`https://api.github.com/repos/${USER}/${REPO}/git/trees/${BRANCH}?recursive=1`,{cache:"no-store"});
  if(!r.ok) throw new Error("api "+r.status);
  return (await r.json()).tree.filter(t=>t.type==="blob").map(t=>t.path);
}
async function fromJsDelivr(){
  const r=await fetch(`https://data.jsdelivr.com/v1/packages/gh/${USER}/${REPO}@${BRANCH}?structure=flat&t=${Date.now()}`);
  if(!r.ok) throw new Error("cdn "+r.status);
  return (await r.json()).files.map(f=>f.name.replace(/^\//,""));
}
async function loadPaths(){
  for(const fn of [fromTree,fromJsDelivr]){
    try{
      const p=(await fn()).filter(x=>x.startsWith(FOLDER+"/")&&EXT.test(x));
      if(p.length){try{localStorage.setItem("pf_paths",JSON.stringify(p))}catch(e){} return p}
    }catch(e){console.warn(e)}
  }
  try{const c=JSON.parse(localStorage.getItem("pf_paths")||"[]");if(c.length)return c}catch(e){}
  return [];
}
/* folder name inside images/ = stack name; loose files go to "More" */
function group(paths){
  const g={};
  paths.forEach(p=>{
    const parts=p.slice(FOLDER.length+1).split("/");parts.pop();
    const cat=parts.length?parts[0]:"More";
    (g[cat]=g[cat]||[]).push(p);
  });
  Object.values(g).forEach(a=>a.sort((x,y)=>nat(y,x)));
  const names=Object.keys(g).sort(nat);
  if(names.includes("More")){names.splice(names.indexOf("More"),1);names.push("More")}
  return names.map(n=>({name:n,files:g[n]}));
}

let stacks=[],cur={s:0,i:0};
const ROT=[[-5,-6,4],[4,8,-6],[-2,-12,10],[7,14,-10]]; /* rotation, x%, y% offsets per print */
function build(){
  const box=$("stacks");box.innerHTML="";
  if(!stacks.length){box.appendChild(el("p","msg","No photos yet. Upload images into a folder inside images/ on GitHub and they will appear here as a stack."));return}
  const total=stacks.reduce((n,s)=>n+s.files.length,0);
  $("tot").textContent=`${total} photos in ${stacks.length} ${stacks.length===1?"stack":"stacks"}`;
  stacks.forEach((s,si)=>{
    const b=el("button","stack");b.setAttribute("aria-label",`Open ${s.name}, ${s.files.length} photos`);
    const pile=el("span","pile");
    const top=s.files.slice(0,4);
    for(let k=top.length-1;k>=0;k--){
      const r=ROT[k],p=el("span","p");
      p.style.setProperty("--r",(k===0?r[0]*.5:r[0])+"deg");
      p.style.setProperty("--x",r[1]*.35+"px");p.style.setProperty("--y",r[2]*.3+"px");
      const im=el("img");im.src=RAW(top[k]);im.alt="";im.loading="lazy";im.onerror=()=>p.remove();
      p.appendChild(im);pile.appendChild(p);
    }
    const lab=el("span","lab");lab.append(el("h3",null,nice(s.name)),el("span",null,String(s.files.length)));
    b.append(pile,lab);b.onclick=()=>openDeck(si);box.appendChild(b);
  });
}
/* --- stack opens: photos are dealt onto the table --- */
function openDeck(si,pushHash=true){
  cur.s=si;const s=stacks[si];
  $("dt").textContent=nice(s.name);$("dt").appendChild(el("span",null,s.files.length+" photos"));
  const m=$("masonry");m.innerHTML="";
  s.files.forEach((p,i)=>{
    const b=el("button","print");b.style.setProperty("--i",i);b.style.setProperty("--t",(i%2?5:-5));
    b.setAttribute("aria-label",`View photo ${i+1} of ${s.files.length}`);
    const im=el("img");im.src=RAW(p);im.alt=`${nice(s.name)}, photo ${i+1}`;im.loading="lazy";im.onerror=()=>b.remove();
    b.appendChild(im);b.onclick=()=>openLb(i);m.appendChild(b);
  });
  $("deck").classList.add("open");$("deck").scrollTop=0;document.body.style.overflow="hidden";
  if(pushHash)history.replaceState(null,"","#"+encodeURIComponent(s.name));
  $("back").focus();
}
function closeDeck(){
  $("deck").classList.remove("open");document.body.style.overflow="";
  history.replaceState(null,"",location.pathname+location.search);
}
$("back").onclick=closeDeck;
/* --- single photo viewer --- */
function openLb(i){
  const f=stacks[cur.s].files;cur.i=(i+f.length)%f.length;
  $("li").src=RAW(f[cur.i]);$("li").alt=`${nice(stacks[cur.s].name)}, photo ${cur.i+1}`;
  $("cap").textContent=`${nice(stacks[cur.s].name)}: ${cur.i+1} of ${f.length}`;
  $("lb").classList.add("open");
}
const closeLb=()=>$("lb").classList.remove("open");
$("lx").onclick=closeLb;
$("lp").onclick=()=>openLb(cur.i-1);
$("ln").onclick=()=>openLb(cur.i+1);
$("lb").onclick=e=>{if(e.target===$("lb"))closeLb()};
let sx=null;
$("li").addEventListener("pointerdown",e=>{sx=e.clientX});
$("li").addEventListener("pointerup",e=>{if(sx==null)return;const d=e.clientX-sx;sx=null;if(Math.abs(d)>50)openLb(cur.i+(d<0?1:-1))});
addEventListener("keydown",e=>{
  if($("lb").classList.contains("open")){
    if(e.key==="Escape")closeLb();
    if(e.key==="ArrowLeft")openLb(cur.i-1);
    if(e.key==="ArrowRight")openLb(cur.i+1);
  }else if($("deck").classList.contains("open")&&e.key==="Escape")closeDeck();
});

/* --- page text --- */
document.title=`${SITE.name}, portfolio`;
$("nm").textContent=SITE.name;$("nm2").textContent=SITE.name;$("nm3").textContent=SITE.name;
$("line").textContent=SITE.line;$("aboutText").textContent=SITE.about;
$("yr").textContent=new Date().getFullYear();

loadPaths().then(p=>{
  stacks=group(p);build();
  const h=decodeURIComponent(location.hash.slice(1));
  const i=stacks.findIndex(s=>s.name===h);
  if(i>=0)openDeck(i,false);
});
</script>
</body>
</html>
